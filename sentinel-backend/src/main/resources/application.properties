spring.application.name=sentinel-backend
server.port=8080

# PostgreSQL (Docker, პორტი 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sentinel_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AI სერვისი, JWT, საზიარო საქაღალდე
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-min-32-bytes-long!!}
app.scan.dir=${SCAN_DIR:./shared/scans}